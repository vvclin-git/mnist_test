[project]
name = "mnist_test"
version = "0.1.0"
description = "a web app that can predict the number from handwritting"
readme = "README.md"
requires-python = ">=3.10,<3.12"


dependencies = [
    "tensorflowjs",
    "numpy==1.23.5",
    "tensorflow-cpu==2.15.0",
    "ipykernel>=7.1.0",
]


[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
