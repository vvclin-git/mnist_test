<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MNIST TFJS Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #0058a3;
      --yellow: #fbd914;
      --red: #e0082d;
      --green: #94c11c;
      --orange: #f5a623;
      --ink: #0f172a;
      --muted: #4b5563;
      --bg: #f7f7f3;
      --card: #ffffff;
      --radius: 18px;
      --shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at 20% 20%, rgba(251, 217, 20, 0.12), transparent 30%),
                  radial-gradient(circle at 80% 0%, rgba(0, 88, 163, 0.12), transparent 28%),
                  var(--bg);
      color: var(--ink);
      font-family: "Fredoka", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px;
    }

    header.hero {
      text-align: center;
      margin-bottom: 24px;
    }

    .eyebrow {
      display: inline-block;
      background: var(--yellow);
      color: var(--ink);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      letter-spacing: 0.4px;
      font-size: 0.95rem;
    }

    h1 {
      margin: 12px 0 6px;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      justify-items: center;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      border: 3px solid #ffffff;
      width: 100%;
      max-width: 720px;
    }

    .draw-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .canvas-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      justify-items: center;
      gap: 12px;
    }

    #canvas {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      border: 3px solid var(--blue);
      box-shadow: inset 0 0 0 3px #ffffff, 0 10px 26px rgba(0, 88, 163, 0.15);
      background: #ffffff;
      touch-action: none;
    }

    #preview {
      width: 80px;
      height: 80px;
      border-radius: 14px;
      border: 2px dashed var(--muted);
      background: rgba(0, 0, 0, 0.03);
      image-rendering: pixelated;
      display: none;
    }

    .app[data-debug="true"] #preview {
      display: block;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      min-height: 48px;
    }

    .btn.primary {
      background: linear-gradient(120deg, var(--blue), #0b7cd3);
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(0, 88, 163, 0.35);
    }

    .btn.ghost {
      background: #ffffff;
      color: var(--ink);
      border: 2px solid var(--muted);
    }

    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(0, 88, 163, 0.06);
      border-radius: 12px;
      border: 2px dashed rgba(0, 88, 163, 0.2);
    }

    .status-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .label {
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .hint {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .result {
      font-size: 2rem;
      font-weight: 700;
      color: var(--red);
    }

    .info-card h2 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.5rem;
      letter-spacing: -0.01em;
    }

    .info-card ul {
      padding-left: 20px;
      margin: 0;
      color: var(--muted);
    }

    .info-card li { margin-bottom: 8px; }

    @media (max-width: 900px) {
      .canvas-wrap { grid-template-columns: 1fr auto; }
    }

    @media (max-width: 640px) {
      .app { padding: 16px; }
      h1 { font-size: 1.8rem; }
      .canvas-wrap { grid-template-columns: 1fr; }
      #preview { order: -1; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script defer src="./main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="hero">
      <span class="eyebrow">Tiny MNIST demo</span>
      <h1>Playful digits</h1>
      <p class="lead">Draw a number and let the model guess.</p>
    </header>

    <main class="grid">
      <section class="card draw-card">
        <div class="canvas-wrap">
          <canvas id="canvas" width="280" height="280"></canvas>
          <canvas id="preview" width="28" height="28"></canvas>
        </div>

        <div class="controls">
          <button id="clearBtn" class="btn ghost">Clear</button>
        </div>

        <div class="status">
          <div class="status-text">
            <span class="label">Prediction</span>
            <span class="hint" id="statusHint">Idle</span>
          </div>
          <span class="result" id="result">-</span>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
